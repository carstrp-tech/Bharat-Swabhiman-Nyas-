
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#103b2b">
<title>भारत स्वाभिमान न्यास</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">

<style>
:root {
 --green:#103b2b;
 --green2:#1b5940;
 --gold:#d8b66b;
 --cream:#f7f4ec;
 --white:#ffffff;
 --text:#173b2c;
}

* {
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body {
 font-family:'Hind',sans-serif;
 background:var(--cream);
 color:var(--text);
 padding-bottom:82px;
}

/* HEADER */

header {
 background:linear-gradient(135deg,#0b3022,#15523a,#0d3929);
 padding:18px 16px 20px;
 border-radius:0 0 26px 26px;
 box-shadow:0 8px 24px #102d2030;
}

.topbar {
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.brand {
 display:flex;
 align-items:center;
 gap:11px;
}

.logo {
 width:48px;
 height:48px;
 border:1.5px solid var(--gold);
 border-radius:50%;
 display:grid;
 place-items:center;
 color:#f2d48d;
 font-size:27px;
}

.brand h1 {
 font-family:'Yatra One','Hind',sans-serif;
 font-size:19px;
 color:white;
 line-height:1.3;
}

.brand small {
 display:block;
 color:#e7d2a0;
 font-size:10px;
 letter-spacing:1.2px;
}

.admin-btn {
 background:linear-gradient(135deg,#f4d990,#c99e49);
 border:1px solid #f6e2ad;
 border-radius:30px;
 padding:10px 14px;
 color:#193b2b;
 font-family:'Hind',sans-serif;
 font-size:13px;
 font-weight:700;
 white-space:nowrap;
 box-shadow:0 3px 9px #0002;
 cursor:pointer;
}

/* HERO PHOTO */

.hero {
 margin-top:19px;
 padding:8px;
 border:1px solid var(--gold);
 border-radius:19px;
 background:linear-gradient(145deg,#285b40,#0c3022);
 box-shadow:inset 0 0 18px #0002;
}

.hero img {
 width:100%;
 height:210px;
 display:block;
 object-fit:cover;
 object-position:center 35%;
 border-radius:13px;
}

.hero-title {
 color:#f5dfac;
 text-align:center;
 padding:10px 5px 5px;
 font-size:16px;
 font-weight:700;
}

/* CATEGORY SECTION */

main {
 padding:22px 14px 25px;
}

.section-title {
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:16px;
}

.section-title h2 {
 font-family:'Yatra One','Hind',sans-serif;
 color:var(--green);
 font-size:20px;
}

.section-title span {
 color:#9c804c;
 font-size:11px;
}

.category-grid {
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px;
}

.category-card {
 background:white;
 border:1px solid #e8dfcc;
 border-radius:17px;
 min-height:105px;
 padding:13px 10px;
 display:flex;
 align-items:center;
 gap:10px;
 box-shadow:0 5px 15px #193c290c;
 cursor:pointer;
 transition:transform .2s,box-shadow .2s;
}

.category-card:active {
 transform:scale(.97);
}

.category-icon {
 width:45px;
 height:45px;
 min-width:45px;
 border-radius:14px;
 background:linear-gradient(145deg,#fbf5e6,#f0e5ca);
 display:grid;
 place-items:center;
 font-size:23px;
}

.category-info h3 {
 color:#214b36;
 font-size:13px;
 font-weight:700;
 line-height:1.4;
}

.category-info p {
 color:#a0834c;
 font-size:10px;
 margin-top:4px;
}

/* FOOTER */

footer {
 background:linear-gradient(135deg,#0c3022,#1a5038);
 color:white;
 text-align:center;
 padding:19px 12px;
 margin-top:18px;
 border-radius:17px;
}

footer strong {
 display:block;
 font-size:17px;
 font-weight:700;
 letter-spacing:.3px;
}

footer span {
 color:#e8ca82;
 font-size:12px;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
 position:fixed;
 z-index:10;
 bottom:0;
 left:0;
 right:0;
 display:flex;
 justify-content:space-around;
 background:white;
 border-top:1px solid #eee6d6;
 box-shadow:0 -4px 18px #0000000c;
 padding:9px 3px calc(9px + env(safe-area-inset-bottom));
}

.nav-item {
 flex:1;
 text-align:center;
 color:#859087;
 font-size:10px;
 cursor:pointer;
}

.nav-icon {
 display:block;
 font-size:21px;
 margin-bottom:2px;
}

.nav-item.active {
 color:var(--green);
 font-weight:700;
}

/* TABLET / DESKTOP */

@media(min-width:650px) {
 body {
  max-width:650px;
  margin:auto;
 }
 .category-grid {
  grid-template-columns:repeat(3,1fr);
 }
 .hero img {
  height:270px;
 }
}
</style>
</head>

<body>

<header>

 <div class="topbar">

  <div class="brand">
   <div class="logo">ॐ</div>
   <div>
    <h1>भारत स्वाभिमान न्यास</h1>
    <small>UTTAR PRADESH WEST</small>
   </div>
  </div>

  <button class="admin-btn" onclick="adminLogin()">
   ♙ एडमिन लॉगिन
  </button>

 </div>

 <section class="hero">

  <img
   src="./swami-acharya.jpg"
   alt="स्वामी रामदेव जी एवं आचार्य बालकृष्ण जी"
   onerror="this.style.display='none';document.getElementById('photo-error').style.display='block';"
  >

  <div id="photo-error" style="display:none;color:#f5dfac;text-align:center;padding:35px 10px;">
   मुख्य फोटो लोड नहीं हुई। GitHub में फोटो का नाम जाँचें।
  </div>

  <div class="hero-title">
   स्वामी रामदेव जी एवं आचार्य बालकृष्ण जी
  </div>

 </section>

</header>

<main>

 <div class="section-title">
  <h2>पोस्टर कैटेगरी</h2>
  <span>अपनी पसंद चुनें</span>
 </div>

 <div class="category-grid" id="categories"></div>

 <footer>
  <strong>Rohit Pundeer</strong>
  <span>State Office Incharge</span>
 </footer>

</main>

<nav class="bottom-nav">

 <div class="nav-item active">
  <span class="nav-icon">⌂</span>
  होम
 </div>

 <div class="nav-item">
  <span class="nav-icon">▦</span>
  कैटेगरी
 </div>

 <div class="nav-item">
  <span class="nav-icon">▣</span>
  मेरे पोस्टर
 </div>

 <div class="nav-item">
  <span class="nav-icon">♙</span>
  प्रोफाइल
 </div>

</nav>

<script>

const categories = [
 ['योग एवं प्राणायाम','🧘'],
 ['आयुर्वेद एवं घरेलू नुस्खे','🌿'],
 ['जन्मदिवस शुभकामनाएँ','🎂'],
 ['जड़ी-बूटी दिवस','🍃'],
 ['विशेष दिवस एवं राष्ट्रीय पर्व','🇮🇳'],
 ['सनातन संस्कृति एवं धर्म','🕉️'],
 ['राष्ट्रीय त्योहार एवं देशभक्ति','🏵️'],
 ['हिंदू त्योहार एवं उत्सव','🪔'],
 ['सुविचार एवं प्रेरणादायक संदेश','✨'],
 ['पर्यावरण एवं प्रकृति','🌳'],
 ['योग शिक्षक एवं प्रशिक्षण','📿'],
 ['संगठन के कार्यक्रम एवं गतिविधियाँ','🤝']
];

const container = document.getElementById('categories');

categories.forEach((item,index) => {

 const card = document.createElement('div');
 card.className = 'category-card';

 const icon = document.createElement('div');
 icon.className = 'category-icon';
 icon.textContent = item[1];

 const info = document.createElement('div');
 info.className = 'category-info';

 const heading = document.createElement('h3');
 heading.textContent = item[0];

 const caption = document.createElement('p');
 caption.textContent = 'पोस्टर देखें  →';

 info.appendChild(heading);
 info.appendChild(caption);

 card.appendChild(icon);
 card.appendChild(info);

 card.addEventListener('click',() => {
  alert('इस कैटेगरी के पोस्टर अगले चरण में जोड़े जाएँगे।');
 });

 container.appendChild(card);

});

function adminLogin() {
 alert('सुरक्षित एडमिन लॉगिन अगले चरण में बनाया जाएगा।');
}

</script>

</body>
</html>
